## exp_138: Bimodal basis orthogonality + balance
## Base: exp_135 (refreshed baseline)
## Change: basis_orthogonality_loss_type from [rank] to [rank, bimodal, balance]
##         balance_weight=10.0 (moderate amplification)
## Bimodal: min(x^2, (1-x)^2) per pair, where x = |cos_sim|
##   - Pushes each pair to EITHER 0 or 1 (nearest target wins)
##   - Unlike polarize (x*(1-x)), bimodal has steeper gradient near targets
##   - But like polarize, has ZERO gradient at exact degeneracy (x=1)
## Balance: entropy of mean(|cos_sim|) ensures ~half aligned, ~half orthogonal
##   - Provides the escape force from degeneracy (bimodal can't alone)
##   - Weight=10 gives ~7 effective gradient at degeneracy (~2x ortho)
## Hypothesis: Bimodal+balance provides cleaner separation than ortho because
## it pushes toward the CORRECT target ({0,1} with balance) rather than all-zero.
## Keep all proportionality losses from baseline for fair comparison.
model:
  type: SubspaceConceptLattice
  config:
    embed_dim: 128
    ambient_dim: 8
    n_obj: 4
    n_attr: 2
    image_size: 64
    image_channels: 3
    lbd: 0.05
    max_combinations_per_cardinality: 10
    intersection_power_steps: 5
    intersection_consistency_only_pairs: false
    attr_orthogonality_avg_first: false
    attr_force_orthogonal_basis: true
    global_galois_loss_start_epoch: 0
    subspace_gumbel_sigmoid: false
    binary_intersection: false
    binary_inclusion: false
    basis_orthogonality_loss_type:
    - rank
    - bimodal
    - balance
    basis_orthogonality_rank_target: 2.0
    balance_weight: 10.0
    ic_mode: "mse"
    uc_mode: "bounds"
    galois_cycle_weight_mode: temperature
    galois_cycle_threshold: 0.6
    galois_cycle_tau: 0.1
    perceptual_encoder:
      type: ViTEncoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    concept_encoder:
      type: ConceptEncoder
      config:
        mapping_type: mlp
        heads: 8
        clamp_X: false
    decoder:
      type: ViTDecoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    loss_weights:
      reconstruction_loss: 1.0
      singleton_obj_rank_loss: 1.0
      max_singleton_attr_rank_loss: 10.0
      modular_subspace_loss: 0.0
      attr_orthogonality_loss: 0.0
      attr_polarization_loss: 0.0
      concept_similarity_loss: 0.0
      union_consistency_loss: 1.0
      intersection_consistency_loss: 10.0
      attr_sink_loss: 10.0
      galois_attr_loss: 10.0
      galois_obj_loss: 1.0
      global_galois_loss: 0.0
      basis_orthogonality_loss: 1.0
      basis_sparsity_loss: 0.0
      loss_obj_card_prop: 1.0
      loss_attr_card_inv_prop: 10.0
      loss_attr_obj_inv_prop: 1.0
      repulsion_loss_obj: 1.0
      repulsion_loss_attr: 1.0
      residual_orthogonality_loss: 0.0
      rank_conservation_loss: 1.0
      rank_complementarity_loss: 0.0
      margin_topological_sort_loss: 0.0
data:
  train:
    type: v0Dataset
    config:
      image_size:
      - 64
      - 64
      shapes:
      - circle
      - square
      colors:
      - red
      - blue
      excluded_combinations: []
      num_samples: 1000
      return_metadata: true
      center_range:
      - 32
      - 33
      size_range:
      - 20
      - 21
    dataloader_config:
      batch_size: 8
      shuffle: true
trainer:
  max_epochs: 100
  optimizer:
    type: Adam
    config:
      lr: 0.0001
