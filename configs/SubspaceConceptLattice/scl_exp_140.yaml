## exp_140: ambient_dim=4 + attr_obj_orthogonality
## Base: exp_135 (refreshed baseline)
## Change: ambient_dim: 4 (from 8), attr_obj_orthogonality_loss: 1.0,
##         attr_obj_orthogonality_direct: true
## With ambient_dim=4, n_attr=2: each slot gets 2 dims. Attr subspace can span
## at most 4 dims (= full space). Obj also needs 4 dims. If attr-obj orthogonality
## is enforced, they COMPETE for the limited ambient space. This creates:
##   1. Pressure for attr subspaces to NOT fill the entire space → lower ranks
##      for combined concepts (good)
##   2. Obj must live in attr's orthogonal complement → genuine information
##      separation (good)
## Hypothesis: The constrained ambient space + orthogonality creates natural
## rank pressure that partially replaces attr_sink. The tighter space makes
## degenerate solutions more costly (can't waste dims on redundant structure).
## Risk: May be too constrained — harder to reconstruct if attr only gets 2-4 dims.
model:
  type: SubspaceConceptLattice
  config:
    embed_dim: 128
    ambient_dim: 4
    n_obj: 4
    n_attr: 2
    image_size: 64
    image_channels: 3
    lbd: 0.05
    max_combinations_per_cardinality: 10
    intersection_power_steps: 5
    intersection_consistency_only_pairs: false
    attr_orthogonality_avg_first: false
    attr_force_orthogonal_basis: true
    global_galois_loss_start_epoch: 0
    subspace_gumbel_sigmoid: false
    binary_intersection: false
    binary_inclusion: false
    basis_orthogonality_loss_type:
    - rank
    basis_orthogonality_rank_target: 2.0
    ic_mode: "mse"
    uc_mode: "bounds"
    attr_obj_orthogonality_direct: true
    galois_cycle_weight_mode: temperature
    galois_cycle_threshold: 0.6
    galois_cycle_tau: 0.1
    perceptual_encoder:
      type: ViTEncoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    concept_encoder:
      type: ConceptEncoder
      config:
        mapping_type: mlp
        heads: 8
        clamp_X: false
    decoder:
      type: ViTDecoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    loss_weights:
      reconstruction_loss: 1.0
      singleton_obj_rank_loss: 1.0
      max_singleton_attr_rank_loss: 10.0
      modular_subspace_loss: 0.0
      attr_orthogonality_loss: 0.0
      attr_polarization_loss: 0.0
      concept_similarity_loss: 0.0
      union_consistency_loss: 1.0
      intersection_consistency_loss: 10.0
      attr_sink_loss: 10.0
      galois_attr_loss: 10.0
      galois_obj_loss: 1.0
      global_galois_loss: 0.0
      basis_orthogonality_loss: 1.0
      basis_sparsity_loss: 0.0
      loss_obj_card_prop: 1.0
      loss_attr_card_inv_prop: 10.0
      loss_attr_obj_inv_prop: 1.0
      repulsion_loss_obj: 1.0
      repulsion_loss_attr: 1.0
      residual_orthogonality_loss: 0.0
      rank_conservation_loss: 1.0
      attr_obj_orthogonality_loss: 1.0
      rank_complementarity_loss: 0.0
      margin_topological_sort_loss: 0.0
data:
  train:
    type: v0Dataset
    config:
      image_size:
      - 64
      - 64
      shapes:
      - circle
      - square
      colors:
      - red
      - blue
      excluded_combinations: []
      num_samples: 1000
      return_metadata: true
      center_range:
      - 32
      - 33
      size_range:
      - 20
      - 21
    dataloader_config:
      batch_size: 8
      shuffle: true
trainer:
  max_epochs: 100
  optimizer:
    type: Adam
    config:
      lr: 0.0001
