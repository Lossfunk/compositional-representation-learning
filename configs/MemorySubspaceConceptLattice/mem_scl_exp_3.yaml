model:
  type: MemorySubspaceConceptLattice
  config:
    embed_dim: 128
    ambient_dim: 10
    n_attr: 2
    n_obj: 4
    image_size: 64
    image_channels: 3
    lbd: 0.05
    fillers_per_slot:
    - 2
    - 2
    max_combinations_per_cardinality: 10
    tau_start: 1.0
    tau_end: 0.1
    tau_anneal_epochs: 50
    perceptual_encoder:
      type: ViTEncoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    concept_encoder:
      config:
        heads: 8
        resolution_method: inclusion
    decoder:
      type: ViTDecoder
      config:
        patch_size: 8
        depth: 4
        heads: 8
        mlp_ratio: 4.0
    loss_weights:
      # Reduced from 10.0 -> 0.1 to break reconstruction dominance
      # (was 95% of gradient in exp_2, structural losses were starved)
      reconstruction_loss: 0.1
      commitment_loss: 1.0
      # Memory structural: keep strong (proven effective in exp_2)
      memory_slot_orthogonality_loss: 10.0
      memory_obj_rank_loss: 10.0
      memory_obj_orthogonality_loss: 10.0
      # Lattice structural losses
      max_singleton_attr_rank_loss: 10.0
      galois_attr_loss: 10.0
      galois_obj_loss: 10.0
      intersection_consistency_loss: 1.0
      union_consistency_loss: 1.0
      attr_sink_loss: 10.0
      loss_attr_obj_inv_prop: 10.0
      # Repulsion
      repulsion_loss_attr: 10.0
      repulsion_loss_obj: 10.0
      # VQ losses — utilization now on singleton candidates (4+4 vs 9+15)
      assignment_entropy_loss: 0.1
      utilization_loss: 20.0
data:
  train:
    type: v0Dataset
    config:
      image_size:
      - 64
      - 64
      shapes:
      - circle
      - square
      colors:
      - red
      - blue
      excluded_combinations: []
      num_samples: 1000
      return_metadata: true
      center_range:
      - 32
      - 33
      size_range:
      - 20
      - 21
    dataloader_config:
      batch_size: 8
      shuffle: true
trainer:
  max_epochs: 100
  optimizer:
    type: Adam
    config:
      lr: 0.0001
